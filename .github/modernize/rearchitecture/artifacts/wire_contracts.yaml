contracts:
  - name: native-client-photo-analysis
    unit: photo-meal
    type: rest
    stability: frozen
    source_loc: "Endpoints/MealAnalysisEndpoints.cs:28"
    contract:
      method: "POST"
      path: "/api/analyze-meal"
      request: "multipart/form-data; required file field photo (JPG, PNG, or WebP, max 10 MiB); optional text field name (max 80 characters)"
      response: "200 JSON: name:string, calories:number, protein:number, carbs:number, fat:number"
      error: "400 invalid media/form/name; 413 upload/request too large; 429 rate limited; 502 upstream/provider failure; 503 provider not configured/unavailable; 504 timeout; ProblemDetails title is user-facing"
      auth: "No API authentication is configured in the inspected backend."
    target_contract:
      method: "Android HTTP client POST to the configured existing backend base URL plus /api/analyze-meal"
      notes: "Send multipart fields named photo and name, preserve supported image types and file limit, decode the same JSON property names, and display server ProblemDetails. The mobile app must not call OpenAI directly or contain OPENAI_API_KEY."
    semantic_divergence: []

  - name: native-client-ingredient-search
    unit: recipe-library
    type: rest
    stability: must_preserve
    source_loc: "android/app/src/main/java/com/nutria/app/data/remote/OpenFoodFactsClient.kt"
    contract:
      method: "GET"
      path: "https://world.openfoodfacts.org/cgi/search.pl"
      request: "UTF-8 search_terms query, trimmed and constrained to 1–80 characters; Spanish localization; at most 8 products; Android sends User-Agent Nutria/1.0"
      response: "Provider JSON mapped by the clients to code, name, brand, calories, protein, carbs, fat per 100 g; kcal may be derived from kJ"
      error: "Empty query is rejected locally; network, provider rate limit, HTTP and invalid response errors are shown to the user"
      auth: "No provider credential is required."
    target_contract:
      method: "Android and PWA HTTP GET directly to Open Food Facts; no Nutria route or configured backend URL is used for ingredient search"
      notes: "The old GET /api/ingredients/search route is retired. See ADR-0009; preserve source attribution, explicit user-triggered search, result filtering, and manual-entry fallback."
    semantic_divergence:
      - "Approved by ADR-0009: direct Open Food Facts search replaces the frozen Nutria proxy contract."

  - name: server-to-openai-responses
    unit: meal-analysis-api
    type: rest
    stability: must_preserve
    source_loc: "Services/OpenAiMealAnalysisService.cs:14"
    contract:
      method: "POST"
      path: "https://api.openai.com/v1/responses"
      request: "Server-generated JSON input with image data URL and prompt; strict JSON schema for name/calories/protein/carbs/fat; Bearer key from server configuration"
      response: "Responses API output_text containing the strict JSON estimate"
      error: "Provider status is mapped to safe 502/503 errors; invalid response maps to 502; request timeout maps to 504"
      auth: "Bearer OPENAI_API_KEY read only by the server."
    target_contract:
      method: "Keep the server-side OpenAI Responses API integration behind POST /api/analyze-meal"
      notes: "Do not transfer provider credentials or direct provider calls to the mobile application; retain server validation, schema, and safe error mapping."
    semantic_divergence: []

