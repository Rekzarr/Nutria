contracts:
  - name: native-client-photo-analysis
    unit: photo-meal
    type: rest
    stability: frozen
    source_loc: "Endpoints/MealAnalysisEndpoints.cs:28"
    contract:
      method: "POST"
      path: "/api/analyze-meal"
      request: "multipart/form-data; required file field photo (JPG, PNG, or WebP, max 10 MiB); optional text field name (max 80 characters)"
      response: "200 JSON: name:string, calories:number, protein:number, carbs:number, fat:number"
      error: "400 invalid media/form/name; 413 upload/request too large; 429 rate limited; 502 upstream/provider failure; 503 provider not configured/unavailable; 504 timeout; ProblemDetails title is user-facing"
      auth: "No API authentication is configured in the inspected backend."
    target_contract:
      method: "Android HTTP client POST to the configured existing backend base URL plus /api/analyze-meal"
      notes: "Send multipart fields named photo and name, preserve supported image types and file limit, decode the same JSON property names, and display server ProblemDetails. The mobile app must not call OpenAI directly or contain OPENAI_API_KEY."
    semantic_divergence: []

  - name: native-client-ingredient-search
    unit: recipe-library
    type: rest
    stability: frozen
    source_loc: "Endpoints/OpenFoodFactsEndpoints.cs:27"
    contract:
      method: "GET"
      path: "/api/ingredients/search"
      request: "UTF-8 query parameter query, trimmed and constrained to 1–80 characters"
      response: "200 JSON: { products: [{ code, name, brand, calories, protein, carbs, fat }] }; nutrients are per 100 g"
      error: "400 invalid/empty query; 429 rate limited; 502 provider/network/invalid JSON; 504 timeout; ProblemDetails title is user-facing"
      auth: "No API authentication is configured in the inspected backend."
    target_contract:
      method: "Android HTTP client GET to the configured existing backend base URL plus /api/ingredients/search?query={encoded term}"
      notes: "URL-encode the Spanish ingredient query, parse the same products wrapper and nutrient names, and preserve the per-100-g interpretation and error states."
    semantic_divergence: []

  - name: server-to-openai-responses
    unit: meal-analysis-api
    type: rest
    stability: must_preserve
    source_loc: "Services/OpenAiMealAnalysisService.cs:14"
    contract:
      method: "POST"
      path: "https://api.openai.com/v1/responses"
      request: "Server-generated JSON input with image data URL and prompt; strict JSON schema for name/calories/protein/carbs/fat; Bearer key from server configuration"
      response: "Responses API output_text containing the strict JSON estimate"
      error: "Provider status is mapped to safe 502/503 errors; invalid response maps to 502; request timeout maps to 504"
      auth: "Bearer OPENAI_API_KEY read only by the server."
    target_contract:
      method: "Keep the server-side OpenAI Responses API integration behind POST /api/analyze-meal"
      notes: "Do not transfer provider credentials or direct provider calls to the mobile application; retain server validation, schema, and safe error mapping."
    semantic_divergence: []

  - name: server-to-openfoodfacts-search
    unit: ingredient-search-api
    type: rest
    stability: must_preserve
    source_loc: "Services/OpenFoodFactsService.cs:12"
    contract:
      method: "GET"
      path: "https://world.openfoodfacts.org/cgi/search.pl"
      request: "search_terms, search_simple=1, action=process, json=1, lc=es, page_size=8, fields=code,product_name_es,product_name,brands,nutriments; User-Agent Nutria/1.0; Accept application/json"
      response: "Provider products mapped to at most eight complete results; kcal is read directly or converted from kJ; protein/carbs/fat and kcal are per 100 g"
      error: "Up to three attempts for timeout/429/5xx with short increasing delay; final failure is mapped by the Nutria endpoint"
      auth: "No provider credential is configured in the inspected service."
    target_contract:
      method: "Keep the server-side Open Food Facts integration behind GET /api/ingredients/search"
      notes: "The Android client calls Nutria's existing endpoint, not the provider directly, and retains server-side localization, filtering, retries, and product mapping."
    semantic_divergence: []
