unit: meal-analysis-api
side_effects:
  - source_loc: "Services/OpenAiMealAnalysisService.cs:22"
    effect: "Reads OPENAI_API_KEY on the server and sends the image/prompt to OpenAI Responses API."
    must_preserve: true
  - source_loc: "Endpoints/MealAnalysisEndpoints.cs:114"
    effect: "Returns a validated approximate per-portion meal estimate to the caller."
    must_preserve: true
branches:
  - source_loc: "Endpoints/MealAnalysisEndpoints.cs:54"
    condition: "Request is not multipart/form-data, photo is missing/empty, type is not JPG/PNG/WebP, file exceeds 10 MiB, or name exceeds 80 characters."
    behavior: "Reject before provider request with 400 or 413 ProblemDetails."
    must_preserve: true
  - source_loc: "Services/OpenAiMealAnalysisService.cs:22"
    condition: "OPENAI_API_KEY is missing."
    behavior: "Return service-unavailable status with Spanish configuration guidance; key remains server-only."
    must_preserve: true
  - source_loc: "Services/OpenAiMealAnalysisService.cs:92"
    condition: "Provider returns a non-success status."
    behavior: "Map provider failure to a safe 502 or 503 response."
    must_preserve: true
  - source_loc: "Services/OpenAiMealAnalysisService.cs:112"
    condition: "Provider output is missing, malformed, or has invalid/out-of-range values."
    behavior: "Reject the estimate; nutrient values must be finite, non-negative, and at most 10,000."
    must_preserve: true
error_paths:
  - source_loc: "Endpoints/MealAnalysisEndpoints.cs:129"
    trigger: "Provider network failure, provider error, or server-side request timeout."
    outcome: "Return Spanish ProblemDetails with 502, 503, or 504; write a server warning log."
    contract: "Rate limit 10/minute/IP; ASP.NET typed response uses the existing JSON DTO contract."
    must_preserve: true
concurrency:
  model: async
  tx_boundary: null
